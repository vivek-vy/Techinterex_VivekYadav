<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz App</title>
   <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="quiz-container">
      <!-- Start Screen -->
      <div class="start-screen">
        <h1 class="title">Welcome to the Quiz</h1>
        <button class="button start-btn">Start Quiz</button>
      </div>

      <!-- Quiz Screen -->
      <div class="quiz-screen hidden">
        <h1 class="title">Online Quiz App</h1>
        <div class="question"></div>
        <div class="options">
          <button class="option" data-answer="0"></button>
          <button class="option" data-answer="1"></button>
          <button class="option" data-answer="2"></button>
          <button class="option" data-answer="3"></button>
        </div>
        <div class="timer">Time left: 15s</div>
        <button class="next-button button hidden">Next</button>
        <button class="stop-button button hidden">Stop Quiz</button>
        <div class="result"></div>
      </div>
    </div>
